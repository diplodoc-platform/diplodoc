name: Release Train

on:
  workflow_dispatch:
    inputs:
      train_id:
        description: 'Resume key. Empty on first run (generated as rt-<run_number>); copy it from the tracking issue to resume.'
        required: false
        type: string
      prs:
        description: 'Participants: comma-separated PR refs (cli#123, owner/repo#123 or PR URLs)'
        required: false
        type: string
      branch_name:
        description: 'Fallback discovery by shared feature branch name'
        required: false
        type: string
      packages:
        description: 'Comma-separated repo slugs — narrows the branch fallback only'
        required: false
        type: string
      concurrency:
        description: 'How many packages to process at once (default from release-train.yml, currently 3)'
        required: false
        type: string
      dry_run:
        description: 'Plan only, no merges'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One run per train. A resume uses the same train_id, so it queues behind the
# run it is replacing instead of racing it; a fresh run is unique per workflow
# run number.
concurrency:
  group: release-train-${{ inputs.train_id || format('run-{0}', github.run_number) }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release plan
    runs-on: ubuntu-latest
    outputs:
      plan_ready: ${{ steps.prepare.outcome == 'success' && steps.plan_check.outputs.exists == 'true' }}
      train_id: ${{ steps.prepare.outputs.train_id }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      issue_url: ${{ steps.prepare.outputs.issue_url }}
    steps:
      - name: Checkout metapackage
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup Node.js
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''

      - name: Install js-yaml
        run: npm install js-yaml@4 --no-save

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform

      - name: Build release plan
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TRAIN_ID: ${{ inputs.train_id }}
          PRS: ${{ inputs.prs }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          PACKAGES: ${{ inputs.packages }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--output plan.json)
          if [[ -n "${TRAIN_ID:-}" ]]; then
            ARGS+=(--train-id "$TRAIN_ID")
          fi
          if [[ -n "${PRS:-}" ]]; then
            ARGS+=(--prs "$PRS")
          fi
          if [[ -n "${BRANCH_NAME:-}" ]]; then
            ARGS+=(--branch "$BRANCH_NAME")
          fi
          if [[ -n "${PACKAGES:-}" ]]; then
            ARGS+=(--packages "$PACKAGES")
          fi
          if [[ -n "${CONCURRENCY:-}" ]]; then
            ARGS+=(--concurrency "$CONCURRENCY")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          node scripts/release-train/prepare.js "${ARGS[@]}"

      - name: Verify plan.json
        id: plan_check
        run: |
          if [[ -f plan.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload plan
        uses: actions/upload-artifact@v6
        with:
          name: release-train-plan
          path: plan.json
          retention-days: 7

  orchestrate:
    name: Run release train
    needs: prepare
    if: needs.prepare.outputs.plan_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metapackage
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup Node.js
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''

      - name: Install js-yaml
        run: npm install js-yaml@4 --no-save

      - name: Download plan
        uses: actions/download-artifact@v7
        with:
          name: release-train-plan

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: diplodoc-platform

      - name: Run orchestrator
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INFRA_APPROVER_PAT: ${{ secrets.INFRA_APPROVER_PAT }}
          # A train outlives the 1-hour installation token, so the orchestrator
          # re-mints it from the App credentials (scripts/release-train/app-token.js).
          RT_APP_ID: ${{ secrets.INFRA_APP_ID }}
          RT_APP_PRIVATE_KEY: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
        run: node scripts/release-train/orchestrate.js --plan plan.json

      - name: Upload train state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-train-state
          path: |
            train-state.json
            .release-train-status/**
          retention-days: 7
          if-no-files-found: warn

  report:
    name: Build release train report
    needs: [prepare, orchestrate]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metapackage
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup Node.js
        uses: diplodoc-platform/setup-node-action@v1
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: ''

      - name: Download state artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-train-*
          merge-multiple: true

      - name: Render final report
        env:
          TRAIN_ID: ${{ needs.prepare.outputs.train_id }}
          ISSUE_URL: ${{ needs.prepare.outputs.issue_url }}
        run: node scripts/release-train/report.js .release-train-status train-state.json
