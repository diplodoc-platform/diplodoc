name: E2E Tests

permissions:
  contents: read

# E2E Test Runner for Diplodoc Metapackage
#
# This workflow orchestrates full end-to-end testing of the Diplodoc metapackage:
# 1. Initializes all git submodules to master branch (via submodules: recursive)
# 2. Applies optional branch override to all submodules (via git:apply)
#    - If branch exists in a submodule, it will be checked out
#    - If branch doesn't exist, submodule stays on master
# 3. Installs all dependencies (npm i)
# 4. Resets node_modules to ensure proper linking (npm run reset -- -u)
# 5. Runs e2e tests from @diplodoc/testpack

# Set custom run name to include trigger_id for reliable tracking
run-name: ${{ inputs.trigger_id && format('E2E Tests [ID:{0}]', inputs.trigger_id) || 'E2E Tests' }}

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/e2e-tests.yaml"
      - "scripts/e2e-candidate.js"
      - "scripts/e2e-candidate.test.js"
      - "scripts/e2e-artifacts.test.js"

  # Allow manual trigger with parameters
  workflow_dispatch:
    inputs:
      submodules_override:
        description: 'Branch name to checkout in all submodules (e.g., "feature-branch")'
        required: false
        type: string
        default: ""
      trigger_id:
        description: "Unique identifier for this trigger (for tracking)"
        required: false
        type: string
        default: ""
      candidate_repository:
        description: "Registered submodule repository, e.g. diplodoc-platform/tabs-extension"
        required: false
        type: string
        default: ""
      candidate_sha:
        description: "Full candidate commit SHA; requires candidate_repository"
        required: false
        type: string
        default: ""

  # Allow triggering from other repositories (child modules)
  workflow_call:
    inputs:
      submodules_override:
        description: 'Branch name to checkout in all submodules (e.g., "feature-branch")'
        required: false
        type: string
        default: ""
      trigger_id:
        description: "Unique identifier for this trigger (for tracking)"
        required: false
        type: string
        default: ""
      candidate_repository:
        description: "Registered submodule repository, e.g. diplodoc-platform/tabs-extension"
        required: false
        type: string
        default: ""
      candidate_sha:
        description: "Full candidate commit SHA; requires candidate_repository"
        required: false
        type: string
        default: ""

jobs:
  e2e-tests:
    name: "Run E2E Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: diplodoc-platform/diplodoc
          ref: ${{ github.repository == 'diplodoc-platform/diplodoc' && github.sha || 'master' }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: "npm"

      - name: Install latest npm (>= 11.5.1)
        run: |
          [ "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -n1)" = "11.5.1" ] || npm install -g npm@11.5.1
        shell: bash

      - name: Test candidate binding and report contract
        run: node --test scripts/e2e-candidate.test.js scripts/e2e-artifacts.test.js

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Override active branch
        if: inputs.submodules_override != ''
        env:
          SUBMODULES_OVERRIDE: ${{ inputs.submodules_override }}
        run: |
          npm run git:apply -- "$SUBMODULES_OVERRIDE"

      - name: Bind exact candidate and record source identity
        id: candidate
        env:
          E2E_CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          E2E_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          E2E_SUBMODULES_OVERRIDE: ${{ inputs.submodules_override }}
          E2E_CALLER_REPOSITORY: ${{ github.repository }}
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/e2e-candidate.js

      - name: Upload source identity
        uses: actions/upload-artifact@v4
        with:
          name: e2e-source
          path: e2e-source.json
          if-no-files-found: error
          retention-days: 7

      - name: Setup node_modules
        run: |
          npm i
          npm run reset -- -u -q

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Build projects
        run: npm run build -- --verbose

      - name: Link CLI binaries
        run: npm i @diplodoc/cli --ignore-scripts

      # The install above prunes everything it does not know about, including the
      # @diplodoc/infra link that reset puts next to each workspace root. Without
      # it Playwright cannot resolve the "extends" of devops/testpack/tsconfig.json
      # — it looks only in node_modules adjacent to that file and never walks up
      # to the workspace link in the repository root. Re-run reset so the layout
      # survives into the test step; -q makes it a relink with no reinstall.
      - name: Restore workspace links
        run: npm run reset -- -u -q

      - name: Run E2E tests
        id: browser
        run: npm run test

      - name: Upload test results
        if: always() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            devops/testpack/.playwright/result/
            devops/testpack/.playwright/html/
            devops/testpack/.playwright/json/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
