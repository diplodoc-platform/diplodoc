name: Discover Submodules

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - '.github/workflows/discover-submodules.yml'
      - '.github/submodule-requests/**'
      - '.gitmodules-ignore'
      - 'scripts/check-submodules.sh'
      - 'scripts/submodule-*.js'
      - 'scripts/pulse.js'

permissions:
  contents: read

jobs:
  inventory:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Require a placement before merge
        run: |
          if [[ -n "$(git ls-files '.github/submodule-requests/*')" ]]; then
            echo '::error::A maintainer must choose the destination with /submodule-path on this draft.'
            exit 1
          fi

      - name: Test discovery and onboarding rules
        run: node --test scripts/submodule-discovery.test.js scripts/submodule-onboarding.test.js

      - name: Report missing public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/submodule-discovery.md"
          npm run --silent check-submodules > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

  onboard:
    if: >-
      github.repository == 'diplodoc-platform/diplodoc' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
         startsWith(github.event.comment.body, '/submodule-path '))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: submodule-onboarding
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Install YAML helper outside the workspace
        run: |
          npm install --prefix "$RUNNER_TEMP/onboarding-tools" --no-save --package-lock=false --workspaces=false --ignore-scripts js-yaml@4
          echo "NODE_PATH=$RUNNER_TEMP/onboarding-tools/node_modules" >> "$GITHUB_ENV"

      - name: Generate a metapackage App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          repositories: diplodoc
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update onboarding pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'issue_comment' ]]; then
            node scripts/submodule-onboarding.js --event-file "$GITHUB_EVENT_PATH" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/submodule-onboarding.js | tee -a "$GITHUB_STEP_SUMMARY"
          fi
