name: Discover Submodules

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/discover-submodules.yml'
      - '.gitmodules-ignore'
      - 'scripts/check-submodules.sh'
      - 'scripts/submodule-discovery*.js'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: Test discovery rules
        run: node --test scripts/submodule-discovery.test.js

      - name: Report missing public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/submodule-discovery.md"
          npm run --silent check-submodules > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
